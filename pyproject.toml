[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "empirical-workbench"
version = "0.2.0"
dependencies = ["rich>=13,<16"]
description = "Evidence-driven empirical data workflows with a local visual console"
requires-python = ">=3.10"

[project.scripts]
ew = "ew.cli:main"

[tool.setuptools]
packages = ["ew"]

[tool.setuptools.package-data]
ew = ["console.html"]
