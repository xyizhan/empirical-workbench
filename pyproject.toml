[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "empirical-workbench"
dynamic = ["version"]
dependencies = ["rich>=13,<16", "duckdb>=1.1"]
description = "An AI research assistant and local workbench that turns unfamiliar data into verifiable, reproducible empirical analysis data"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "xyizhan"}]
keywords = ["empirical research", "econometrics", "data cleaning", "duckdb", "llm agent", "reproducibility"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.10"

[project.urls]
Homepage = "https://github.com/xyizhan/empirical-workbench"
Documentation = "https://github.com/xyizhan/empirical-workbench/blob/main/docs/run-format.md"

[project.optional-dependencies]
formats = ["pandas>=2", "openpyxl>=3"]

[project.scripts]
ew = "ew.cli:main"

[tool.setuptools]
packages = ["ew"]

[tool.setuptools.dynamic]
version = {attr = "ew.__version__"}

[tool.setuptools.package-data]
ew = ["console.html", "web/*", "web/assets/*"]

[tool.ruff]
target-version = "py310"
line-length = 160

[tool.ruff.lint]
select = ["F", "E9"]
