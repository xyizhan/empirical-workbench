<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Empirical Workbench</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f4ee;color:#202e2b;font:16px/1.55 system-ui}header{background:#153832;color:white;padding:18px 5vw;display:flex;justify-content:space-between;align-items:center}header b{letter-spacing:.06em}main{max-width:1280px;margin:36px auto;padding:0 4vw}h1{font:500 clamp(26px,3vw,43px)/1.25 Georgia,serif;max-width:980px}section{background:white;border:1px solid #d0d9d4;padding:22px;margin:14px 0}nav{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;cursor:pointer;border:1px solid #b8c8bd;background:white;padding:7px 12px;border-radius:4px}button[aria-pressed=true]{background:#18584d;color:white}table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}td,th{padding:8px 12px;text-align:left;border-bottom:1px solid #dde3df;white-space:nowrap}th{background:#edf2ed}article{overflow:auto}summary{cursor:pointer;padding:7px}small{color:#596e66}pre{white-space:pre-wrap;overflow-wrap:anywhere}.bad{color:#a2402a}a{color:#156958}</style>
<header><b>EMPIRICAL WORKBENCH</b><span id="status"></span></header><main><h1 id="question"></h1><nav id="tabs"></nav><section id="panel"></section></main>
<script type="application/json" id="data">__PAYLOAD__</script><script>
const {run,tables}=JSON.parse(data.textContent);const el=(tag,text,parent)=>{const n=document.createElement(tag);n.textContent=text;parent.append(n);return n};
const statusLabel=document.getElementById('status');statusLabel.textContent=run.status==='passed'?'✓ 已通过核验':'● 等待处理';question.textContent=run.question||'研究运行记录';
function draw(tab){panel.replaceChildren();for(const b of tabs.children)b.setAttribute('aria-pressed',b.textContent===tab);
if(tab==='执行轨迹'){for(const stage of run.stages||[]){let d=el('details','',panel);d.open=true;el('summary',stage,d);for(const a of run.attempts.filter(x=>x.stage===stage)){let p=el('p',(a.outcome==='accepted'?'✓ 采用　':'↶ 回溯　')+a.plan,d);if(a.reason){p.className='bad';el('pre',a.reason,d)}}}if(run.reason)el('pre',run.reason,panel)}
if(tab==='数据与核验'){for(const [k,v] of Object.entries(run.sources)){let d=el('details','',panel);el('summary',k+'　'+v.rows.toLocaleString()+' 行',d);el('pre',v.file+'\nSHA256 '+v.sha256,d)}for(const c of run.checks)el('div',(c.passed?'✓ ':'× ')+c.name,panel)}
if(tab==='探索与底表'){const groups=tables['探索对照.csv'];if(groups){el('h2','样本和指标改变后，评分差怎样变化？',panel);const labels={A:'全部评分样本',B:'固定为送达后有评价的样本',C:'同一批订单，仅用送达后评分'};for(const [k,label] of Object.entries(labels)){const rows=groups.slice(1).filter(r=>r[0]===k);if(rows.length===2){const gap=Number(rows[0][3])-Number(rows[1][3]);el('div',label+'　'+gap.toFixed(3)+' 分',panel);const bar=el('div','',panel);bar.style.cssText='height:10px;background:#217669;margin:5px 0 16px;width:'+Math.min(100,Math.abs(gap)*25)+'%'}}}const select=el('select','',panel);for(const k of Object.keys(tables).sort((a,b)=>Number(b.includes('探索'))-Number(a.includes('探索'))))el('option',k,select);const area=el('article','',panel);function show(){area.replaceChildren();let rows=tables[select.value]||[];const table=el('table','',area);rows.forEach((r,i)=>{let tr=el('tr','',table);r.forEach(x=>el(i?'td':'th',x,tr))});el('small','显示前 50 行　',area);if(select.value){let a=el('a','打开完整 CSV',area);a.href=encodeURIComponent(select.value)}}select.onchange=show;show()}}
for(const name of ['执行轨迹','数据与核验','探索与底表'])el('button',name,tabs).onclick=()=>draw(name);draw('执行轨迹');
</script></html>
